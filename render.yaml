services:
  - type: web
    name: peopleos
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Postgres connection string (a free Neon database works). Without it, data lives
      # on Render's temporary disk and is wiped on every restart or redeploy.
      - key: DATABASE_URL
        sync: false
      # Optional: an AI key turns on free-form questions. Without one the app uses rules.
      - key: GEMINI_API_KEY
        sync: false
      # Optional: email invites, password resets and leave/ticket notifications (free Brevo account).
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
